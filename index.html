<style>
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;width:min(340px,100%);display:grid;gap:10px}

<div class="lock" id="lock"><form class="lockbox" id="lockform"><h1>韓文學習</h1><p id="locktip">讀取中…</p>
  <input id="lockpw" type="password" autocomplete="current-password" placeholder="密碼" hidden><button type="submit" id="lockgo" hidden>打開</button><p class="lockmsg" id="lockmsg" aria-live="polite"></p></form></div>
<script>
/* Everything on this site is encrypted (AES-GCM, key from the password with PBKDF2): data.enc = words + themes + audio map,
   a/<name> = one mp3 each, cfg.enc = the GitHub token for saving, edits.enc on the "edits" branch = changes made on the site.
   Each file is 12-byte IV + ciphertext. The key is kept in localStorage, so the password is asked once per device. */
(async()=>{
const REPO="krstudy/korean-audio",API="https://api.github.com/repos/"+REPO;
const te=new TextEncoder(),td=new TextDecoder();
const $=id=>document.getElementById(id);
const b64e=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=b=>{const s=atob(b.replace(/\s/g,"")),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
let key=null;
const dec=async u8=>new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8.subarray(0,12)},key,u8.subarray(12)));
const enc=async u8=>{const iv=crypto.getRandomValues(new Uint8Array(12));const c=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,u8));const o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return o};
const get=async(p,o)=>{const r=await fetch(p,o);if(!r.ok)return null;return new Uint8Array(await r.arrayBuffer())};
let meta,dataRaw;
try{[meta,dataRaw]=await Promise.all([fetch("meta.json",{cache:"no-cache"}).then(r=>r.json()),get("data.enc",{cache:"no-cache"})]);if(!dataRaw)throw 0}
catch(e){$("locktip").textContent="讀不到網站資料，請檢查網路後重新整理。";return}
async function tryKey(raw){try{key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);return JSON.parse(td.decode(await dec(dataRaw)))}catch(e){key=null;return null}}
let D=null;const saved=ls("kr-key");if(saved)D=await tryKey(b64d(saved));
if(!D){ls("kr-key",null);$("locktip").textContent="請輸入密碼（每台裝置只要輸入一次）";$("lockpw").hidden=$("lockgo").hidden=false;$("lockpw").focus();
  await new Promise(res=>{$("lockform").onsubmit=async e=>{e.preventDefault();const pw=$("lockpw").value;if(!pw)return;$("lockmsg").textContent="解鎖中…";
    const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveBits"]);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64d(meta.salt),iterations:meta.iter},base,256));
    D=await tryKey(bits);if(!D){$("lockmsg").textContent="密碼不對，再試一次";return}ls("kr-key",b64e(bits));res()}})}
let token=null;
try{const c=await get("cfg.enc",{cache:"no-cache"});if(c){token=JSON.parse(td.decode(await dec(c))).token||null;if(token)ls("kr-tok",token)}}catch(e){}
if(!token)token=ls("kr-tok");
const hdr=()=>{const h={Accept:"application/vnd.github+json"};if(S.token)h.Authorization="Bearer "+S.token;return h};
const encB64=async o=>b64e(await enc(te.encode(JSON.stringify(o))));
async function put(path,branch,obj,sha,tok){const r=await fetch(API+"/contents/"+path,{method:"PUT",headers:{...hdr(),...(tok?{Authorization:"Bearer "+tok}:{})},
    body:JSON.stringify({message:"update "+path,branch,content:await encB64(obj),...(sha?{sha}:{})})});
  if(r.status===409||r.status===422){const e=new Error("和其他裝置同時儲存");e.conflict=true;throw e}
  if(r.status===401)throw new Error("權杖不能用或已經過期，請到「管理 → 編輯權限」換一個新的");
  if(r.status===403||r.status===404)throw new Error("權杖沒有寫入權限（Contents 要選 Read and write）");
  if(!r.ok)throw new Error("GitHub 回應 "+r.status);return r.json()}
const S=window.__S={token,
  file:async p=>{const u=await get(p);return u?dec(u):null},
  async pull(){const r=await fetch(API+"/contents/edits.enc?ref=edits",{headers:hdr(),cache:"no-store"});
    if(r.status===404)return{map:{},sha:null};if(!r.ok)throw new Error("讀取失敗 "+r.status);
    const j=await r.json();let b=j.content;
    if(!b||j.encoding==="none"){const r2=await fetch(API+"/git/blobs/"+j.sha,{headers:hdr(),cache:"no-store"});b=(await r2.json()).content} /* over 1 MB */
    return{map:JSON.parse(td.decode(await dec(b64d(b)))),sha:j.sha}},
  async push(m,sha){return put("edits.enc","edits",m,sha)},
  async setToken(t){const r=await fetch(API+"/contents/cfg.enc?ref=main",{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+t},cache:"no-store"});
    if(r.status===401)throw new Error("這個權杖不能用，請確認有完整複製");
    if(!r.ok&&r.status!==404)throw new Error("這個權杖看不到 korean-audio（Repository access 要選 korean-audio）");
    const sha=r.ok?(await r.json()).sha:null;
    await put("cfg.enc","main",{token:t},sha,t);S.token=t;ls("kr-tok",t)}};
window.__D=D;
const sc=document.createElement("script");sc.src="app.js?v="+meta.v;sc.onload=()=>{$("lock").hidden=true};document.body.appendChild(sc);
})();
</script>
